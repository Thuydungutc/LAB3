<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mạch báo cháy gia đình</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1c1f26;--muted:#6b7280;--border:#e3e6eb;
  --ok:#16a34a;--warn:#f59e0b;--danger:#dc2626;--gas:#ea580c;--temp:#dc2626;--accent:#2563eb;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1115;--card:#181b22;--text:#eef0f4;--muted:#9aa3b2;--border:#2a2f3a;--accent:#60a5fa;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b22;--text:#eef0f4;--muted:#9aa3b2;--border:#2a2f3a;--accent:#60a5fa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:1.25rem;margin:0}
.status{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--danger)}
.dot.on{background:var(--ok)}.dot.demo{background:var(--warn)}
.panel,.card,.chartbox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.panel{margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);gap:4px;flex:1 1 180px}
input,select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem;width:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 14px;border-radius:10px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.alert{display:none;background:var(--danger);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:600}
.alert.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.card .lbl{font-size:.8rem;color:var(--muted)}
.card .val{font-size:2.4rem;font-weight:700;margin-top:4px}
.card .val small{font-size:1rem;font-weight:500;color:var(--muted)}
.card .th{font-size:.75rem;color:var(--muted)}
.card.bad{border-color:var(--danger)}.card.bad .val{color:var(--danger)}
.chartbox h3{margin:0 0 8px;font-size:.9rem}
.chartwrap{position:relative;height:200px}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.dev{font-size:1.05rem;font-weight:700;padding:18px;border-radius:12px;border:2px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.dev.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mode{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem}
.badge{padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--border);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;font-size:.9rem;max-width:90%}
.hint{font-size:.78rem;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔥 Mạch báo cháy gia đình</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="stText">Chưa kết nối</span></div>
  </header>

  <div class="panel">
    <div class="row">
      <label>Broker (WebSocket)
        <input id="broker" value="broker.hivemq.com (wss:8884)" readonly>
      </label>
      <label>Prefix topic 
        <input id="prefix" value="firealarm/mssv123">
      </label>
      <button class="primary" id="btnConn">Kết nối</button>
      <button id="btnDemo">Chế độ demo</button>
    </div>
    <div class="hint">Dashboard dùng broker.hivemq.com</div>
  </div>

  <div class="alert" id="alert"></div>

  <div class="grid">
    <div class="card" id="cardGas"><div class="lbl">Nồng độ khí gas (MQ2)</div><div class="val"><span id="gasValue">--</span> <small>ADC</small></div><div class="th">Ngưỡng: 2000 → bật quạt</div></div>
    <div class="card" id="cardTemp"><div class="lbl">Nhiệt độ (DHT22)</div><div class="val"><span id="tempValue">--</span> <small>°C</small></div><div class="th">Ngưỡng: 50 °C → bật máy bơm</div></div>
  </div>

  <div class="grid">
    <div class="chartbox"><h3>Biểu đồ khí gas</h3><div class="chartwrap"><canvas id="gasChart"></canvas></div></div>
    <div class="chartbox"><h3>Biểu đồ nhiệt độ</h3><div class="chartwrap"><canvas id="tempChart"></canvas></div></div>
  </div>

  <div class="panel">
    <div class="ctrl">
      <button class="dev" id="btnPump"><span>💧 Máy bơm</span><span id="pumpTxt">OFF</span></button>
      <button class="dev" id="btnFan"><span>🌀 Quạt</span><span id="fanTxt">OFF</span></button>
    </div>
    <div class="mode">
      <span>Chế độ:</span><span class="badge" id="modeBadge">AUTO</span>
      <button id="btnAuto">Về chế độ AUTO</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const GAS_TH = 2000, TEMP_TH = 50, MAXPTS = 30;
const BROKER_URL = 'wss://broker.hivemq.com:8884/mqtt';
const $ = id => document.getElementById(id);
let client = null, demoTimer = null, connected = false, demo = false;
let state = { fan:false, pump:false, manual:false, gas:null, temp:null };

// ---- lưu cấu hình (có thể không dùng được trong một số môi trường)
try { const s = JSON.parse(localStorage.getItem('fa_cfg')||'{}');
  if (s.prefix) $('prefix').value = s.prefix; } catch(e){}
function saveCfg(){ try{ localStorage.setItem('fa_cfg', JSON.stringify({prefix:$('prefix').value})); }catch(e){} }

function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',2600); }
function setStatus(text, cls){ $('stText').textContent=text; $('dot').className='dot '+(cls||''); }

// ---- biểu đồ
const css = getComputedStyle(document.documentElement);
const tickColor = css.getPropertyValue('--muted').trim() || '#888';
function mkChart(id, color, label){
  return new Chart($(id), { type:'line',
    data:{ labels:[], datasets:[{ label, data:[], borderColor:color, backgroundColor:color+'33', fill:true, tension:.3, pointRadius:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{display:false} },
      scales:{ x:{ ticks:{color:tickColor, maxTicksLimit:6}, grid:{color:'rgba(128,128,128,.15)'} },
               y:{ ticks:{color:tickColor}, grid:{color:'rgba(128,128,128,.15)'} } } } });
}
const gasChart = mkChart('gasChart', '#ea580c', 'Khí gas');
const tempChart = mkChart('tempChart', '#dc2626', 'Nhiệt độ');
function push(chart, v){
  const t = new Date().toLocaleTimeString('vi-VN');
  chart.data.labels.push(t); chart.data.datasets[0].data.push(v);
  if (chart.data.labels.length > MAXPTS){ chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
  chart.update();
}

// ---- cập nhật giao diện
function render(){
  $('fanTxt').textContent = state.fan ? 'ON' : 'OFF';
  $('pumpTxt').textContent = state.pump ? 'ON' : 'OFF';
  $('btnFan').classList.toggle('on', state.fan);
  $('btnPump').classList.toggle('on', state.pump);
  $('modeBadge').textContent = state.manual ? 'MANUAL' : 'AUTO';
  const gb = state.gas !== null && state.gas > GAS_TH, tb = state.temp !== null && state.temp > TEMP_TH;
  $('cardGas').classList.toggle('bad', gb); $('cardTemp').classList.toggle('bad', tb);
  const a = $('alert'), msgs = [];
  if (gb) msgs.push('⚠️ Khí gas vượt ngưỡng!'); if (tb) msgs.push('🔥 Nhiệt độ vượt ngưỡng!');
  a.textContent = msgs.join('  '); a.classList.toggle('show', msgs.length>0);
}
function onGas(v){ state.gas=v; $('gasValue').textContent=Math.round(v); push(gasChart, Math.round(v)); render(); }
function onTemp(v){ state.temp=v; $('tempValue').textContent=v.toFixed(1); push(tempChart, +v.toFixed(1)); render(); }

// ---- MQTT
const base = () => $('prefix').value.trim().replace(/\/+$/,'');
function connect(){
  stopDemo(); saveCfg();
  if (client){ try{client.end(true);}catch(e){} client=null; }
  if (typeof mqtt === 'undefined'){ toast('Không tải được thư viện mqtt.js'); return; }
  setStatus('Đang kết nối...', 'demo');
  const url = BROKER_URL;
  client = mqtt.connect(url, { clientId:'web-fire-'+Math.random().toString(16).slice(2,8), reconnectPeriod:3000, connectTimeout:8000 });
  client.on('connect', () => {
    connected = true; setStatus('Đã kết nối '+url.replace(/^wss?:\/\//,''), 'on');
    ['gas','temp','status/fan','status/pump'].forEach(t => client.subscribe(base()+'/'+t));
  });
  client.on('reconnect', () => setStatus('Đang kết nối lại...', 'demo'));
  client.on('close', () => { connected = false; setStatus('Mất kết nối', ''); });
  client.on('error', e => { setStatus('Lỗi kết nối', ''); console.error(e); });
  client.on('message', (topic, payload) => {
    const m = payload.toString().trim(), t = topic.slice(base().length+1);
    if (t==='gas'){ const v=parseFloat(m); if(!isNaN(v)) onGas(v); }
    else if (t==='temp'){ const v=parseFloat(m); if(!isNaN(v)) onTemp(v); }
    else if (t==='status/fan'){ state.fan = (m==='ON'); render(); }
    else if (t==='status/pump'){ state.pump = (m==='ON'); render(); }
  });
}

// ---- điều khiển
function send(sub, val){
  if (demo) return true;
  if (!connected){ toast('Chưa kết nối MQTT'); return false; }
  client.publish(base()+'/'+sub, val); return true;
}
function toggle(dev){
  const next = !state[dev];
  if (!send('cmd/'+dev, next?'ON':'OFF')) return;
  state[dev] = next; state.manual = true; render();
}
$('btnFan').onclick = () => toggle('fan');
$('btnPump').onclick = () => toggle('pump');
$('btnAuto').onclick = () => { if (!send('cmd/mode','AUTO')) return; state.manual=false; render(); };
$('btnConn').onclick = connect;

// ---- chế độ demo (dữ liệu giả, để xem thử giao diện)
let g=900, tp=28;
function startDemo(){
  if (client){ try{client.end(true);}catch(e){} client=null; connected=false; }
  demo = true; setStatus('Chế độ demo (dữ liệu giả lập)', 'demo'); $('btnDemo').textContent='Tắt demo';
  demoTimer = setInterval(() => {
    g = Math.max(300, Math.min(3600, g + (Math.random()-.42)*350));
    tp = Math.max(24, Math.min(70, tp + (Math.random()-.45)*3));
    onGas(g); onTemp(tp);
    if (!state.manual){ state.fan = g>GAS_TH; state.pump = tp>TEMP_TH; render(); }
  }, 1500);
}
function stopDemo(){ if (demoTimer){ clearInterval(demoTimer); demoTimer=null; } demo=false; $('btnDemo').textContent='Chế độ demo'; }
$('btnDemo').onclick = () => demo ? (stopDemo(), setStatus('Chưa kết nối','')) : startDemo();
render();
</script>
</body>
</html>
